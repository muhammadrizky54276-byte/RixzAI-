<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RixzAI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#0c0c09;--card:#12120e;--bd:#2a2a22;--txt:#f2f2ea;--mut:#8d8d80;--pill:#0a0a08;--btn:#1c1c16;--g1:#2a9d6f;--g2:#e0a040;--bub:#1a1a14;--ok:#1fa36b}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6f0;--card:#fff;--bd:#e0e0d4;--txt:#1a1a14;--mut:#77776a;--pill:#fff;--btn:#ececE2;--bub:#fff}}
:root[data-theme="light"]{--bg:#f6f6f0;--card:#fff;--bd:#e0e0d4;--txt:#1a1a14;--mut:#77776a;--pill:#fff;--btn:#ececE2;--bub:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.ib{width:40px;height:40px;border:0;border-radius:10px;background:var(--btn);color:var(--txt);display:grid;place-items:center;cursor:pointer}
.pill{display:flex;align-items:center;gap:8px;background:var(--pill);border:1px solid var(--bd);border-radius:999px;padding:9px 16px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.sp{flex:1}
#chat{flex:1;overflow-y:auto;padding:18px 16px}
.wrap{max-width:760px;margin:0 auto}
.hero{text-align:center;padding-top:14px}
.logo{width:76px;height:76px;border-radius:22px;margin:0 auto 22px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#0c0c09}
.logo svg{width:34px;height:34px;fill:currentColor;stroke:none}
h1{font-size:30px;margin:0 0 14px}
.hero p{color:var(--mut);font-size:17px;line-height:1.6;margin:0 0 24px}
.cards{display:grid;gap:14px;text-align:left}
.cd{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:18px;color:var(--txt);font:inherit;cursor:pointer;text-align:left}
.cd:hover{border-color:var(--g1)}
.ci{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
.cd b{display:block;font-size:18px;margin-bottom:6px}
.cd span{color:var(--mut);font-size:15px}
.msg{display:flex;margin:12px 0}
.msg.me{justify-content:flex-end}
.bub{max-width:88%;padding:11px 15px;border-radius:16px;line-height:1.6;font-size:15px;overflow-wrap:anywhere;background:var(--bub);border:1px solid var(--bd)}
.me .bub{background:linear-gradient(135deg,var(--g1),#218a5f);color:#fff;border-color:transparent}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:4px 0 8px;padding-left:20px}
.bub code{background:rgba(127,127,120,.2);padding:1px 5px;border-radius:5px}
footer{padding:10px 14px 12px;border-top:1px solid var(--bd)}
.box{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:8px 8px 8px 18px}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--txt);font:inherit;font-size:16px;max-height:130px;padding:8px 0}
textarea::placeholder{color:var(--mut)}
#send{width:46px;height:46px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#0c0c09;display:grid;place-items:center;cursor:pointer;flex:none}
#send:disabled{opacity:.4;cursor:default}
.note{max-width:760px;margin:6px auto 0;text-align:center;color:var(--mut);font-size:11.5px}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:9}
#dr{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:84%;background:var(--card);border-right:1px solid var(--bd);transform:translateX(-100%);transition:.22s;z-index:10;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
body.open #dr{transform:none}body.open #bd{opacity:1;pointer-events:auto}
#dr h3{margin:4px 6px 12px;font-size:16px}
.nw{border:1px dashed var(--g1);background:none;color:var(--txt);border-radius:12px;padding:11px;font:inherit;cursor:pointer;margin-bottom:12px}
#list{flex:1;overflow-y:auto}
.it{display:flex;align-items:center;gap:6px;padding:10px;border-radius:10px;cursor:pointer;font-size:14px}
.it:hover,.it.on{background:var(--btn)}
.it span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it button{border:0;background:none;color:var(--mut);cursor:pointer;padding:2px}
.empty{color:var(--mut);font-size:14px;padding:8px}
.me2{border-top:1px solid var(--bd);padding-top:12px;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
.me2 span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me2 button{border:1px solid var(--bd);background:none;color:var(--txt);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
#lg{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#lg.off{display:none}
#lg p{color:var(--mut);max-width:340px;line-height:1.6;margin:0 0 26px}
#gbtn{display:flex;align-items:center;gap:10px;background:#fff;color:#222;border:0;border-radius:999px;padding:13px 24px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
#gbtn b{color:#4285f4;font-size:20px}
#lerr{color:#e5604d;font-size:13px;margin-top:14px;min-height:18px}
</style>
</head>
<body>
<header>
  <button class="ib" id="menu" aria-label="Riwayat chat"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="pill"><i class="dot"></i>RixzAI Online</div>
  <div class="sp"></div>
  <button class="ib" id="theme" aria-label="Tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button class="ib" id="del" aria-label="Hapus chat ini"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg></button>
</header>
<main id="chat"><div class="wrap" id="w"></div></main>
<footer>
  <div class="box">
    <textarea id="in" rows="1" placeholder="Tanya apa saja ke RixzAI..."></textarea>
    <button id="send" aria-label="Kirim"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M3 20.5v-6.8l11-1.7-11-1.7V3.5L22 12z"/></svg></button>
  </div>
  <div class="note">RixzAI bisa keliru. Harga &amp; berita 2026 tidak real-time, cek lagi ke sumber resmi.</div>
</footer>
<div id="bd"></div>
<aside id="dr"><h3>Riwayat Chat</h3><button class="nw" id="nw">+ Chat baru</button><div id="list"></div>
</aside>
<script type="module">
const $=id=>document.getElementById(id),W=$('w'),chatEl=$('chat'),inp=$('in'),btn=$('send'),TK='rixzai:theme';
const IC={a:'<path d="M22 10 12 5 2 10l10 5 10-5zM6 12v5c3 2.5 9 2.5 12 0v-5"/>',b:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/>',c:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c3 3 3 17 0 20M12 2c-3 3-3 17 0 20"/>',d:'<path d="M4 4h13v16H6a2 2 0 0 1-2-2V4zM17 8h3v10a2 2 0 0 1-2 2M8 8h5M8 12h5"/>'};
const CARDS=[['a','Pelajaran Sekolah','Materi SD, SMP, SMA sampai kuliah','#123626','#4fd39a','Jelaskan cara mudah belajar perkalian dan pembagian untuk anak kelas 3 SD'],['b','Harga Barang','Kisaran harga barang & kebutuhan','#3a2a10','#f0b24a','Kisaran harga laptop untuk kuliah di Indonesia sekarang berapa?'],['c','Sejarah Dunia','Peristiwa, tokoh, dan peradaban','#122a3a','#5cb6f0','Ceritakan ringkas penyebab Perang Dunia II'],['d','Berita 2026','Informasi & topik terbaru 2026','#2a1a3a','#b98af0','Apa topik berita besar yang kamu ketahui di tahun 2026?']];
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function md(t){const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');let o='',ls=null,m;const cl=()=>{if(ls){o+='</'+ls+'>';ls=null}};
 for(const l of esc(t).split('\n')){
  if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(ls!=='ul'){cl();o+='<ul>';ls='ul'}o+='<li>'+inl(m[1])+'</li>'}
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(ls!=='ol'){cl();o+='<ol>';ls='ol'}o+='<li>'+inl(m[1])+'</li>'}
  else if(!l.trim())cl();
  else{cl();o+='<p>'+(/^#+\s/.test(l)?'<b>'+inl(l.replace(/^#+\s*/,''))+'</b>':inl(l))+'</p>'}}
 cl();return o}
let chats=[],cur=null,busy=false;const K='rixzai:chats';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(chats.slice(0,50)))}catch(e){}};
const get=()=>chats.find(c=>c.id===cur);
function bubble(role,html){const d=document.createElement('div');d.className='msg '+(role==='user'?'me':'ai');const b=document.createElement('div');b.className='bub';b.innerHTML=html;d.appendChild(b);W.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return b}
function render(){
 W.innerHTML='';const c=get();
 if(!c||!c.msgs.length){
  const nm='';
  W.innerHTML='<div class="hero"><div class="logo"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div><h1></h1><p>Asisten AI berbahasa Indonesia. Tanyakan materi pelajaran dari SD sampai kuliah, harga barang, sejarah dunia, atau berita terbaru 2026.</p><div class="cards"></div></div>';
  W.querySelector('h1').textContent='Halo, '+(nm||'saya RixzAI');
  const g=W.querySelector('.cards');
  CARDS.forEach(([i,t,s,bg,fg,q])=>{const b=document.createElement('button');b.className='cd';b.innerHTML='<div class="ci" style="background:'+bg+';color:'+fg+'"><svg viewBox="0 0 24 24">'+IC[i]+'</svg></div><b>'+t+'</b><span>'+s+'</span>';b.onclick=()=>ask(q);g.appendChild(b)});
 }else c.msgs.forEach(m=>bubble(m.role,md(m.content)));
 list();
}
function list(){
 const L=$('list');L.innerHTML='';
 if(!chats.length){L.innerHTML='<div class="empty">Belum ada riwayat.</div>';return}
 chats.forEach(c=>{const d=document.createElement('div');d.className='it'+(c.id===cur?' on':'');d.innerHTML='<span></span><button aria-label="Hapus">✕</button>';d.firstChild.textContent=c.title;
  d.onclick=()=>{cur=c.id;render();document.body.classList.remove('open')};
  d.lastChild.onclick=e=>{e.stopPropagation();rm(c.id)};L.appendChild(d)})}
function rm(id){chats=chats.filter(c=>c.id!==id);save();if(id===cur)cur=null;render()}
async function ask(text){
 text=(text||'').trim();if(!text||busy)return;
 let c=get();
 if(!c){c={id:Date.now().toString(36),title:text.slice(0,40),msgs:[]};chats.unshift(c);cur=c.id}
 c.msgs.push({role:'user',content:text});
 render();inp.value='';inp.style.height='auto';
 const b=bubble('ai','<i style="color:var(--mut)">RixzAI sedang berpikir…</i>');
 busy=true;btn.disabled=true;
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.msgs})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.text)throw new Error(d.error||'gagal');
  c.msgs.push({role:'assistant',content:d.text});save();b.innerHTML=md(d.text);
 }catch(e){
  c.msgs.pop();save();b.innerHTML='<p>Maaf, RixzAI belum bisa menjawab sekarang. Coba kirim ulang pertanyaanmu.</p>';
 }
 busy=false;btn.disabled=false;list();
}
btn.onclick=()=>ask(inp.value);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(inp.value)}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,130)+'px'});
$('menu').onclick=()=>document.body.classList.add('open');
$('bd').onclick=()=>document.body.classList.remove('open');
$('nw').onclick=()=>{cur=null;render();document.body.classList.remove('open')};
$('del').onclick=()=>{if(cur)rm(cur)};
$('theme').onclick=()=>{const r=document.documentElement,light=r.dataset.theme?r.dataset.theme==='light':matchMedia('(prefers-color-scheme:light)').matches;const n=light?'dark':'light';r.dataset.theme=n;try{localStorage.setItem(TK,n)}catch(e){}};
try{const t=localStorage.getItem(TK);if(t)document.documentElement.dataset.theme=t}catch(e){}
try{chats=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
render();
</script>
</body>
</html>
